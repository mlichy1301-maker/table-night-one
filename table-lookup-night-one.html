<head>
  <meta charset="UTF-8" />
  <title>Find Your Table</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f5f5fa, #e8ecf5);
      padding: 16px;
    }

    .card {
      background: white;
      max-width: 450px;
      width: 100%;
      padding: 28px 24px 24px;
      border-radius: 18px;
      box-shadow: 0 18px 35px rgba(15, 23, 42, 0.12);
    }

    .event-title {
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      margin-bottom: 4px;
      letter-spacing: 0.02em;
    }

    .event-subtitle {
      font-size: 0.9rem;
      text-align: center;
      color: #64748b;
      margin-bottom: 20px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #475569;
      display: block;
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5f5;
      font-size: 0.98rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    input[type="text"]:focus {
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.18);
    }

    button {
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      background: #4f46e5;
      color: white;
      font-weight: 500;
      font-size: 0.96rem;
      cursor: pointer;
      transition: background 0.15s ease;
      box-shadow: 0 8px 16px rgba(79, 70, 229, 0.25);
    }

    button:hover {
      background: #4338ca;
    }

    .hint {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-bottom: 18px;
    }

    .result {
      margin-top: 8px;
      padding: 12px 12px;
      border-radius: 12px;
      font-size: 0.98rem;
      display: none;
    }

    .result.success {
      background: #ecfdf3;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .result.error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .footer-note {
      margin-top: 14px;
      font-size: 0.7rem;
      color: #9ca3af;
      text-align: center;
    }
  </style>
</head>
<body>

    <div class="event-title">Find Your Table</div>
    <div class="event-subtitle">Type your name to see your table number.</div>

    <label for="nameInput">Guest name</label>
    <div class="input-row">
      <input
        id="nameInput"
        type="text"
        placeholder="Start typing your first and last name"
        autocomplete="off"
      />
      <button id="searchBtn">Search</button>
    </div>

    <div class="hint">Tip: Use the same spelling as the RSVP list.</div>

    <div id="result" class="result"></div>

    <div class="footer-note">Having trouble? Please see the check-in desk.</div>
  </div>

    function normalize(str) {
      return str.trim().toLowerCase();
    }

    function findGuest(name) {
      const query = normalize(name);
      if (!query) return null;

      let matches = guests.filter(g => normalize(g.name) === query);

      if (matches.length === 0) {
        matches = guests.filter(g => normalize(g.name).includes(query));
      }

      if (matches.length === 0) return { type: "none" };
      if (matches.length === 1) return { type: "single", guest: matches[0] };
      return { type: "multiple", guests: matches };
    }

    const resultBox = document.getElementById("result");
    const nameInput = document.getElementById("nameInput");

    function showResult(result, inputName) {
      if (!result) {
        resultBox.style.display = "none";
        return;
      }

      resultBox.style.display = "block";

      if (result.type === "none") {
        resultBox.className = "result error";
        resultBox.innerHTML =
          `No match found for "<strong>${inputName}</strong>". Please check the spelling.`;
      } else if (result.type === "single") {
        resultBox.className = "result success";
        resultBox.innerHTML =
          `<strong>${result.guest.name}</strong> is seated at <strong>Table ${result.guest.table}</strong>.`;
      } else {
        resultBox.className = "result success";
        const list = result.guests
          .map(g => `<li><strong>${g.name}</strong> — Table ${g.table}</li>`)
          .join("");
        resultBox.innerHTML =
          `Multiple matches found:<br><ul>${list}</ul>`;
      }
    }

    function doSearch() {
      const input = nameInput.value;
      const result = findGuest(input);
      showResult(result, input);
    }

    document.getElementById("searchBtn").addEventListener("click", doSearch);
    nameInput.addEventListener("keyup", e => {
      if (e.key === "Enter") doSearch();
    });
  </script>
